<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Workshop</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
</head>
<body>

    <div class="wrapper">
        <h1 class="judul-halaman">Formulir Pendaftaran Workshop</h1>

        <form action="" method="post">
            
            <!-- Tabel 1: Data Peserta -->
            <table class="tabel-blok">
                <tr>
                    <td colspan="2" class="header-tabel">Data Peserta</td>
                </tr>
                <tr>
                    <td style="width: 32%;">
                        <label for="nama">Nama Lengkap</label>
                    </td>
                    <td>
                        <input type="text" id="nama" name="nama" />
                    </td>
                </tr>
                <tr>
                    <td style="width: 32%;">
                        <label for="nim">NIM</label>
                    </td>
                    <td>
                        <input type="text" id="nim" name="nim" />
                    </td>
                </tr>
                <tr>
                    <td style="width: 32%;">Jenis Kelamin</td>
                    <td>
                        <input type="radio" id="laki" name="jk" value="Laki-laki" />
                        <label for="laki">Laki-laki</label>
                        <input type="radio" id="perempuan" name="jk" value="Perempuan" />
                        <label for="perempuan">Perempuan</label>
                    </td>
                </tr>
                <tr>
                    <td style="width: 32%;">
                        <label for="prodi">Program Studi</label>
                    </td>
                    <td>
                        <select id="prodi" name="prodi">
                            <option value="Informatika">Informatika</option>
                            <option value="Sistem Informasi">Sistem Informasi</option>
                            <option value="Teknik Industri">Teknik Industri</option>
                        </select>
                    </td>
                </tr>
            </table>

            <!-- Tabel 2: Pilihan Workshop -->
            <table class="tabel-blok">
                <tr>
                    <td colspan="2" class="header-tabel">Pilihan Workshop</td>
                </tr>
                <tr>
                    <td style="width: 32%;">Kategori Peserta</td>
                    <td>
                        <input type="radio" id="mhs" name="kategori" value="Mahasiswa" />
                        <label for="mhs">Mahasiswa</label>
                        <input type="radio" id="umum" name="kategori" value="Umum" />
                        <label for="umum">Umum</label>
                    </td>
                </tr>
                <tr>
                    <td style="width: 32%; vertical-align: top;">Materi yang Dipilih</td>
                    <td>
                        <input type="checkbox" id="uiux" name="materi" value="UI/UX Design" />
                        <label for="uiux">UI/UX Design</label><br />
                        <input type="checkbox" id="webdev" name="materi" value="Web Development" />
                        <label for="webdev">Web Development</label><br />
                        <input type="checkbox" id="data" name="materi" value="Data Analysis" />
                        <label for="data">Data Analysis</label>
                    </td>
                </tr>
            </table>

            <!-- Tabel 3: Informasi Tambahan -->
            <table class="tabel-blok">
                <tr>
                    <td colspan="2" class="header-tabel">Informasi Tambahan</td>
                </tr>
                <tr>
                    <td style="width: 32%; vertical-align: top;">
                        <label for="alasan">Alasan Mengikuti Acara</label>
                    </td>
                    <td>
                        <textarea id="alasan" name="alasan" rows="4" cols="30"></textarea>
                    </td>
                </tr>
                <tr>
                    <td style="width: 32%;">Metode Pembayaran</td>
                    <td>
                        <input type="radio" id="qris" name="metode" value="QRIS" />
                        <label for="qris">QRIS</label>
                        <input type="radio" id="transfer" name="metode" value="Transfer Bank" />
                        <label for="transfer">Transfer Bank</label>
                    </td>
                </tr>
                <tr>
                    <td style="width: 32%;">
                        <label for="bukti">Bukti Transfer</label>
                    </td>
                    <td>
                        <input type="file" id="bukti" name="bukti" />
                    </td>
                </tr>
            </table>

            <!-- Tombol Submit -->
            <div class="area-tombol">
                <input type="submit" name="daftar" value="Daftar" class="tombol-daftar" />
            </div>

        </form>
    </div>

</body>
</html>
